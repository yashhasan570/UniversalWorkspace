[package]
name = "uniflow-core"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lib-dispatch = { workspace = true }
lib-log = { workspace = true }
uniflow-user = { workspace = true }
uniflow-user-pub = { workspace = true }
uniflow-folder = { workspace = true }
uniflow-folder-pub = { workspace = true }
uniflow-database2 = { workspace = true }
uniflow-database-pub = { workspace = true }
uniflow-sqlite = { workspace = true }
uniflow-document = { workspace = true }
uniflow-document-pub = { workspace = true }
uniflow-error = { workspace = true }
uniflow-server = { workspace = true }
uniflow-server-pub = { workspace = true }
uniflow-date = { workspace = true }
collab-integrate = { workspace = true }
uniflow-search = { workspace = true }
uniflow-search-pub = { workspace = true }
collab-entity = { workspace = true }
collab-plugins = { workspace = true }
collab-folder = { workspace = true }
collab-document = { workspace = true }

collab = { workspace = true }
#collab = { workspace = true, features = ["verbose_log"] }

diesel.workspace = true
uniflow-storage = { workspace = true }
uniflow-storage-pub = { workspace = true }
client-api.workspace = true
uniflow-ai = { workspace = true }
uniflow-ai-pub = { workspace = true }


tracing.workspace = true
futures-core = { version = "0.3", default-features = false }
futures = "0.3"
bytes.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
console-subscriber = { version = "0.2", optional = true }
anyhow.workspace = true
dashmap.workspace = true
arc-swap.workspace = true
base64 = "0.21.5"
tokio-util.workspace = true
lib-infra = { workspace = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sysinfo = "0.30.5"
semver = { version = "1.0.22", features = ["serde"] }
url = "2.5.0"
once_cell = "1.19.0"


[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
uniflow-sqlite-vec = { workspace = true }
twox-hash = { version = "2.1.0", features = ["xxhash64"] }

[features]
profiling = ["console-subscriber", "tokio/tracing"]
http_sync = []
native_sync = []
dart = [
  "uniflow-user/dart",
  "uniflow-date/dart",
  "uniflow-search/dart",
  "uniflow-folder/dart",
  "uniflow-database2/dart",
  "uniflow-ai/dart",
  "uniflow-storage/dart",
]
openssl_vendored = ["uniflow-sqlite/openssl_vendored"]

# Enable/Disable UniversalWorkspace Verbose Log Configuration
verbose_log = [
  "uniflow-document/verbose_log",
  "uniflow-database2/verbose_log",
  "client-api/sync_verbose_log",
]
