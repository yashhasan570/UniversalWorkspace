[package]
name = "uniflow-folder"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
collab = { workspace = true }
collab-folder = { workspace = true }
collab-entity = { workspace = true }
collab-integrate = { workspace = true }
uniflow-folder-pub = { workspace = true }
uniflow-search-pub = { workspace = true }
uniflow-user-pub = { workspace = true }
uniflow-sqlite = { workspace = true }
uniflow-derive.workspace = true
uniflow-notification = { workspace = true }
arc-swap.workspace = true
unicode-segmentation = "1.10"
tracing.workspace = true
uniflow-error = { path = "../uniflow-error", features = [
  "impl_from_dispatch_error",
  "impl_from_collab_folder",
] }
lib-dispatch = { workspace = true }
bytes.workspace = true
lib-infra = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
strum_macros = "0.21"
protobuf.workspace = true
uuid.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
validator.workspace = true
async-trait.workspace = true
client-api = { workspace = true }
regex = "1.9.5"
futures = "0.3.31"
dashmap.workspace = true
num_enum.workspace = true


[build-dependencies]
uniflow-codegen.workspace = true

[features]
dart = ["uniflow-codegen/dart", "uniflow-notification/dart"]
test_helper = []
