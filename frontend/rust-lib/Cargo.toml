[workspace]
members = [
  "lib-dispatch",
  "lib-log",
  "uniflow-core",
  "dart-ffi",
  "uniflow-user",
  "uniflow-user-pub",
  "event-integration-test",
  "uniflow-sqlite",
  "uniflow-folder",
  "uniflow-folder-pub",
  "uniflow-notification",
  "uniflow-document",
  "uniflow-document-pub",
  "uniflow-error",
  "uniflow-database2",
  "uniflow-database-pub",
  "uniflow-server",
  "uniflow-server-pub",
  "uniflow-storage",
  "collab-integrate",
  "uniflow-date",
  "uniflow-search",
  "lib-infra",
  "build-tool/uniflow-ast",
  "build-tool/uniflow-codegen",
  "build-tool/uniflow-derive",
  "uniflow-search-pub",
  "uniflow-ai",
  "uniflow-ai-pub",
  "uniflow-storage-pub",
  "uniflow-sqlite-vec",
]

resolver = "2"

[workspace.dependencies]
lib-dispatch = { path = "lib-dispatch" }
lib-log = { path = "lib-log" }
lib-infra = { path = "lib-infra" }
uniflow-ast = { path = "build-tool/uniflow-ast" }
uniflow-codegen = { path = "build-tool/uniflow-codegen" }
uniflow-derive = { path = "build-tool/uniflow-derive" }
uniflow-core = { path = "uniflow-core" }
dart-ffi = { path = "dart-ffi" }
uniflow-user = { path = "uniflow-user" }
uniflow-user-pub = { path = "uniflow-user-pub" }
uniflow-sqlite = { path = "uniflow-sqlite" }
uniflow-folder = { path = "uniflow-folder" }
uniflow-folder-pub = { path = "uniflow-folder-pub" }
uniflow-notification = { path = "uniflow-notification" }
uniflow-document = { path = "uniflow-document" }
uniflow-document-pub = { path = "uniflow-document-pub" }
uniflow-error = { path = "uniflow-error" }
uniflow-database2 = { path = "uniflow-database2" }
uniflow-database-pub = { path = "uniflow-database-pub" }
uniflow-server = { path = "uniflow-server" }
uniflow-server-pub = { path = "uniflow-server-pub" }
uniflow-storage = { path = "uniflow-storage" }
uniflow-storage-pub = { path = "uniflow-storage-pub" }
uniflow-search = { path = "uniflow-search" }
uniflow-search-pub = { path = "uniflow-search-pub" }
collab-integrate = { path = "collab-integrate" }
uniflow-date = { path = "uniflow-date" }
uniflow-ai = { path = "uniflow-ai" }
uniflow-ai-pub = { path = "uniflow-ai-pub" }
anyhow = "1.0"
arc-swap = "1.7"
tracing = "0.1.40"
bytes = "1.5.0"
serde_json = "1.0.108"
serde = "1.0.194"
protobuf = { version = "2.28.0" }
diesel = { version = "2.1.0", features = [
  "sqlite",
  "chrono",
  "r2d2",
  "serde_json",
] }
diesel_derives = { version = "2.1.0", features = ["sqlite", "r2d2"] }
uuid = { version = "1.5.0", features = ["serde", "v4", "v5"] }
serde_repr = "0.1"
futures = "0.3.31"
tokio = "1.38.0"
tokio-stream = "0.1.17"
ollama-rs = { version = "0.3.0" }
async-trait = "0.1.81"
chrono = { version = "0.4.31", default-features = false, features = ["clock"] }
collab = { version = "0.2" }
collab-entity = { version = "0.2" }
collab-folder = { version = "0.2" }
collab-document = { version = "0.2" }
collab-database = { version = "0.2" }
collab-plugins = { version = "0.2" }
collab-user = { version = "0.2" }
collab-importer = { version = "0.1" }
yrs = "0.21.0"
validator = { version = "0.18", features = ["derive"] }
tokio-util = "0.7.11"
zip = "2.2.0"
dashmap = "6.0.1"
derive_builder = "0.20.2"
tantivy = { version = "0.24.1" }
num_enum = "0.7.3"
uniflow-sqlite-vec = { path = "uniflow-sqlite-vec" }

# Please using the following command to update the revision id
# Current directory: frontend
# Run the script.add_workspace_members:
# scripts/tool/update_client_api_rev.sh  new_rev_id
# ⚠️⚠️⚠️️
client-api = { git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Cloud", rev = "592f644" }
client-api-entity = { git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Cloud", rev = "592f644" }
workspace-template = { git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Cloud", rev = "592f644" }

[profile.dev]
opt-level = 0
lto = false
codegen-units = 16
debug = true

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
codegen-units = 16
lto = false

#strip = "debuginfo"
incremental = true

[patch.crates-io]
# We're using a specific commit here because rust-rocksdb doesn't publish the latest version that includes the memory alignment fix.
# For more details, see https://github.com/rust-rocksdb/rust-rocksdb/pull/868
rocksdb = { git = "https://github.com/rust-rocksdb/rust-rocksdb", rev = "1710120e4549e04ba3baa6a1ee5a5a801fa45a72" }
# Please use the following script to update collab.
# Working directory: frontend
#
# To update the commit ID, run:
# scripts/tool/update_collab_rev.sh new_rev_id
#
# To switch to the local path, run:
# scripts/tool/update_collab_source.sh
# ⚠️⚠️⚠️️
collab = { version = "0.2", git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Collab", rev = "4dfccef" }
collab-entity = { version = "0.2", git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Collab", rev = "4dfccef" }
collab-folder = { version = "0.2", git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Collab", rev = "4dfccef" }
collab-document = { version = "0.2", git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Collab", rev = "4dfccef" }
collab-database = { version = "0.2", git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Collab", rev = "4dfccef" }
collab-plugins = { version = "0.2", git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Collab", rev = "4dfccef" }
collab-user = { version = "0.2", git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Collab", rev = "4dfccef" }
collab-importer = { version = "0.1", git = "https://github.com/UniversalWorkspace-IO/UniversalWorkspace-Collab", rev = "4dfccef" }

langchain-rust = { version = "4.6.0", git = "https://github.com/universalworkspace/langchain-rust", branch = "af" }
